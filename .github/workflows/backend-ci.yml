name: Backend CI

# apps/backend가 바뀐 PR/브랜치에서만 돈다 (모노레포라 프론트 변경엔 반응 안 함).
# main push는 일부러 제외 — backend-cd.yml의 test job이 이미 같은 테스트를 돌린다.
# GitHub UI(Actions 탭 → Run workflow)로 임의 브랜치에서 수동 실행하고 싶을 때는
# workflow_dispatch를 쓴다.
on:
  pull_request:
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches-ignore:
      - main
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch: {}

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/backend

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # pom.xml의 unit-tests 프로필: IntegrationTest 및 Testcontainers 의존
      # 테스트(AuthControllerTest 등)를 제외한 순수 단위 테스트만 실행.
      - name: Run unit tests
        run: ./mvnw -B -Punit-tests test

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: apps/backend/target/surefire-reports
          retention-days: 7

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # ubuntu-latest 러너는 Docker 데몬을 기본 탑재하고 있어 Testcontainers가
      # 별도 설정 없이 MongoDB/Redis 컨테이너를 띄울 수 있다.
      - name: Run integration tests (Testcontainers)
        run: ./mvnw -B -Pintegration-tests test

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: apps/backend/target/surefire-reports
          retention-days: 7

  build:
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # 테스트는 위 두 job이 이미 검증했으므로 여기서는 패키징만 확인.
      - name: Package jar
        run: ./mvnw -B clean package -DskipTests

      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar-${{ github.sha }}
          path: apps/backend/target/ktb-chat-backend-0.0.1-SNAPSHOT.jar
          retention-days: 7

