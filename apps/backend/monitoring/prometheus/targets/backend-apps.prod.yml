# Production Environment - Backend App Metrics (actuator/prometheus)
# 앱 노드의 Spring Boot 지표 타겟 목록
# 노드가 늘거나 IP가 바뀌면 이 파일을 직접 수정하세요.
# file_sd이므로 파일만 갱신되면 Prometheus 재시작 불필요.

# App Server (Spring Boot actuator, management.server.port 미설정이라 앱 포트(5001)와 동일)
- targets:
    - '10.0.101.13:5001'   # be-api
    - '10.0.101.155:5001'  # be-socket
  labels:
    application: 'ktb-chat-backend'
    environment: 'production'
    region: 'ap-northeast-2'
    cluster: 'app'
    service: 'backend'
