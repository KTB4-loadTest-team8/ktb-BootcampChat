# Production Environment - Node Exporters
# 프로덕션 환경의 Node Exporter 타겟 목록
# 서버 추가 시 이 파일만 수정하면 자동으로 반영됩니다 (Prometheus 재시작 불필요)

# Backend (API)
- targets:
    - '10.0.101.13:9100'
  labels:
    environment: 'production'
    region: 'ap-northeast-2'
    cluster: 'app'
    service: 'be-api'

# Backend (Socket)
- targets:
    - '10.0.101.155:9100'
  labels:
    environment: 'production'
    region: 'ap-northeast-2'
    cluster: 'app'
    service: 'be-socket'

# Frontend
- targets:
    - '10.0.101.224:9100'
  labels:
    environment: 'production'
    region: 'ap-northeast-2'
    cluster: 'app'
    service: 'frontend'

# Database Cluster
- targets:
    - '10.0.101.78:9100'   # mongo, prometheus.prod.yml의 mongodb_exporter와 같은 호스트
  labels:
    environment: 'production'
    region: 'ap-northeast-2'
    cluster: 'database'
    service: 'mongodb'

# Redis Cluster
- targets:
    - '10.0.101.192:9100'  # redis, 위와 동일한 호스트
  labels:
    environment: 'production'
    region: 'ap-northeast-2'
    cluster: 'cache'
    service: 'redis'

# Monitoring Server
- targets:
    - '10.0.101.241:9100'
  labels:
    environment: 'production'
    region: 'ap-northeast-2'
    cluster: 'monitoring'
    service: 'observability'