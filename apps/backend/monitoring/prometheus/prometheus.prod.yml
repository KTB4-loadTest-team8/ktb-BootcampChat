global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - '/etc/prometheus/rules.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'spring-boot-app'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets/backend-apps.prod.yml'
        refresh_interval: 5s

  - job_name: 'mongodb'
    static_configs:
      - targets: ['10.0.101.78:9216'] # your-mongo-server
        labels:
          environment: 'production'

  - job_name: 'redis'
    static_configs:
      - targets: ['10.0.101.192:9121'] # redis1 (master m1 / replica r3)
        labels:
          environment: 'production'
          node: 'redis1'
      - targets: ['10.0.102.192:9121'] # redis2 (master m2 / replica r1)
        labels:
          environment: 'production'
          node: 'redis2'
      - targets: ['10.0.101.118:9121'] # redis3 (master m3 / replica r2)
        labels:
          environment: 'production'
          node: 'redis3'

  - job_name: 'node-exporter'
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets/node-exporters.prod.yml'
        refresh_interval: 5s
