# Server Configuration
server.port=${PORT:5001}

# Chat-entry endpoints perform blocking MongoDB reads, so keep enough servlet
# workers for the expected concurrent load while allowing deployment overrides.
server.tomcat.threads.max=${TOMCAT_THREADS_MAX:50}
server.tomcat.threads.min-spare=${TOMCAT_THREADS_MIN_SPARE:10}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:100}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:100}

# Database Configuration
# Spring Boot 4: connection settings moved from spring.data.mongodb.* to spring.mongodb.*
spring.mongodb.uri=${MONGO_URI}
spring.data.mongodb.auto-index-creation=true

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Application-level Redis cache (Socket.IO uses its own Redisson store)
app.cache.rooms.ttl-seconds=${ROOMS_CACHE_TTL_SECONDS:10}

# Message read status is not part of the chat-entry response critical path.
# Keep its async executor bounded so a burst of room entries cannot overwhelm MongoDB.
chat.message-read-status.executor.core-pool-size=${MESSAGE_READ_STATUS_CORE_POOL_SIZE:2}
chat.message-read-status.executor.max-pool-size=${MESSAGE_READ_STATUS_MAX_POOL_SIZE:4}
chat.message-read-status.executor.queue-capacity=${MESSAGE_READ_STATUS_QUEUE_CAPACITY:100}
chat.chat-room-initial-load.executor.core-pool-size=${CHAT_ROOM_INITIAL_LOAD_CORE_POOL_SIZE:2}
chat.chat-room-initial-load.executor.max-pool-size=${CHAT_ROOM_INITIAL_LOAD_MAX_POOL_SIZE:4}
chat.chat-room-initial-load.executor.queue-capacity=${CHAT_ROOM_INITIAL_LOAD_QUEUE_CAPACITY:100}
chat.room-join-post-process.executor.core-pool-size=${CHAT_ROOM_POST_JOIN_CORE_POOL_SIZE:1}
chat.room-join-post-process.executor.max-pool-size=${CHAT_ROOM_POST_JOIN_MAX_POOL_SIZE:2}
chat.room-join-post-process.executor.queue-capacity=${CHAT_ROOM_POST_JOIN_QUEUE_CAPACITY:100}

# File Upload Configuration
# Storage type: local or s3 (default: local)
file.storage.type=${FILE_STORAGE_TYPE:local}
file.upload-dir=./uploads
aws.region=${AWS_REGION:ap-northeast-2}
aws.s3.bucket=${S3_BUCKET:}

# Multipart upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
server.tomcat.max-http-form-post-size=5MB

# Security Configuration
app.encryption.key=${ENCRYPTION_KEY:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
app.encryption.salt=${ENCRYPTION_SALT:3132333435363738}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# OpenAI Configuration
spring.ai.openai.api-key=${OPENAI_API_KEY:your_openai_api_key_here}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4.1-mini}
spring.ai.openai.chat.options.temperature=${OPENAI_TEMPERATURE:0.7}

# Socket.IO Server Configuration
socketio.server.host=0.0.0.0
socketio.server.port=${WS_PORT:5002}
socketio.server.origin=${SOCKETIO_SERVER_ORIGIN:*}
socketio.server.accept-backlog=${SOCKETIO_ACCEPT_BACKLOG:100}
socketio.redis.enabled=${SOCKETIO_REDIS_ENABLED:false}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Logging Configuration
logging.level.org.springframework=INFO
logging.level.com.ktb.chatapp=INFO
logging.level.org.mongodb=INFO

# Content Moderation
chatapp.banned-word.location=classpath:fake_banned_words_10k.txt

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/api/v3/api-docs
springdoc.swagger-ui.path=/api/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.packages-to-scan=com.ktb.chatapp.controller
springdoc.paths-to-match=/api/**
springdoc.show-actuator=false

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.access.default=read-only
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:when_authorized}
management.endpoint.prometheus.access=read_only
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name:ktb-chat-backend}
management.metrics.tags.host=${HOSTNAME:unknown}
